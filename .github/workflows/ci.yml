name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: npm run verify:deployed-source
      - run: npm run lint:contract
      - name: Cache pinned GenVM runner bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
          key: genvm-runners-v0.3.0-rc7-e218a185
      - name: Seed gltest runner bundle
        shell: bash
        run: |
          target="$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          mkdir -p "$(dirname "$target")"
          if [ ! -f "$target" ]; then
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
              --output "$target"
          fi
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $target" | sha256sum --check --strict
      - name: Run direct contract tests
        shell: bash
        run: |
          set +e
          output=$(python -m pytest tests/direct -q --tb=short 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            escaped=$(printf '%s' "$output" | tail -c 6000 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Direct contract tests failed::$escaped"
          fi
          exit "$status"

  e2e-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npm run test:e2e -- --project=desktop
